name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Export Expo web bundle
        run: npx expo export --platform web --output-dir dist

      - name: Fix asset paths for GitHub Pages subdirectory
        run: |
          sed -i 's|href="/favicon.ico"|href="/UpperRoom/favicon.ico"|g' dist/index.html
          sed -i 's|src="/_expo|src="/UpperRoom/_expo|g' dist/index.html
          sed -i 's|href="/_expo|href="/UpperRoom/_expo|g' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
